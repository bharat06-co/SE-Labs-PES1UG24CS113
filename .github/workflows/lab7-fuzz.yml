name: Lab 7 - Hypothesis Fuzz Testing
on:
  push:
    paths:
      - 'Lab7/**'
      - '.github/workflows/lab7-fuzz.yml'
  workflow_dispatch:
jobs:
  hypothesis-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r Lab7/requirements.txt reportlab pillow
      - name: Run original buggy program and record output
        working-directory: Lab7
        run: |
          printf 'medium:6\n3,6,12\n2400|200\n' | python baseline/processor.py | tee evidence/original_program.txt
      - name: Verify Hypothesis exposes bugs in original application
        working-directory: Lab7
        run: |
          cp processor.py /tmp/lab7-corrected-processor.py
          cp baseline/processor.py processor.py
          set +e
          python -m pytest -q test_processor.py --tb=short > evidence/baseline_hypothesis_results.txt 2>&1
          result=$?
          set -e
          cat evidence/baseline_hypothesis_results.txt
          cp /tmp/lab7-corrected-processor.py processor.py
          if [ "$result" -eq 0 ]; then
            echo 'Unexpected result: the original application passed all fuzz tests.'
            exit 1
          fi
          echo 'Expected result: the original application failed Hypothesis tests.'
      - name: Run corrected application and record output
        working-directory: Lab7
        run: |
          printf 'medium:6\n3,6,12\n2400|200\n' | python processor.py | tee evidence/corrected_program.txt
          printf 'medium:bad\n3,,6\nabc|2\n' | python processor.py | tee evidence/corrected_invalid_program.txt
      - name: Verify corrected application with Hypothesis
        working-directory: Lab7
        run: python -m pytest -q test_processor.py --tb=short | tee evidence/final_hypothesis_results.txt
      - name: Build consolidated report
        working-directory: Lab7
        run: python build_lab7_report.py
      - name: Upload verification logs and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab7-hypothesis-evidence
          path: |
            Lab7/evidence/*.txt
            Lab7/Lab7_Fuzz_Testing_Report.pdf
